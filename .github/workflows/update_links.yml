name: Daily AI Link Curator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser google-generativeai

      - name: Run Curator Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/curator.py

      - name: Commit & Push changes
        run: |
          git config --global user.name "AI Curator Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/links.json
          git commit -m "chore: dodano nowe polecane linki [skip ci]" || exit 0
          git push
